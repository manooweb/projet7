# Intégration et déploiement continus de MicroCRM : build, tests et analyse SonarQube Cloud du back et du front,
# puis build, scan Trivy et publication des images sur GHCR (push sur main seulement), suivis d'un test de fumée.
# latest n'avance qu'après le test de fumée : une image publiée mais défaillante n'est jamais récupérée par défaut.
# Les actions sont fixées par SHA de commit (un tag peut être déplacé) ; la version figure en commentaire.
# Un jeton SonarQube par projet (SONAR_TOKEN_BACK, SONAR_TOKEN_FRONT) : chacun ne permet d'analyser que son projet.
# Quality gate Sonar et scan Trivy rendent compte sans bloquer : ils jugent le projet de départ, dont les
# vulnérabilités et la dette sont documentées et traitées par le plan de mise à jour, pas par la CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * *" # chaque nuit, 02:23 UTC, sur main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back (Gradle, JUnit, JaCoCo, Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    env:
      # Seulement un booléen : le jeton lui-même n'est exposé qu'à l'étape d'analyse
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : Sonar s'en sert pour attribuer le nouveau code
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build, tests et couverture
        run: ./gradlew build

      - name: Analyse SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true' # absent sur les PR de forks et de Dependabot
        continue-on-error: true # verdict de la quality gate affiché, sans faire échouer le job
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true

      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: back-rapports
          path: |
            back/build/reports/tests/test
            back/build/reports/jacoco/test
          retention-days: 14

  front:
    name: Front (npm, Karma, lcov, Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    env:
      # Seulement un booléen : le jeton lui-même n'est exposé qu'à l'étape d'analyse
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Signatures des paquets npm
        run: npm audit signatures # vérifie que les paquets installés sont bien signés par le registre npm

      - name: Tests et couverture
        run: npm run test:ci

      - name: Build de production
        run: npm run build

      - name: Analyse SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          projectBaseDir: front
          args: -Dsonar.qualitygate.wait=true

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-couverture
          path: front/coverage/microcrm
          retention-days: 14

  images:
    name: Image ${{ matrix.service }} (build, Trivy, GHCR)
    needs: [back, front]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publication sur GHCR ; le jeton n'est utilisé qu'à l'étape de publication
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    env:
      IMAGE: ghcr.io/manooweb/microcrm-${{ matrix.service }}
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build de l'image
        run: >
          docker build --target ${{ matrix.service }}
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$IMAGE:$GITHUB_SHA" .

      - name: Rapport Trivy (HIGH et CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" "$TRIVY"
          image --severity HIGH,CRITICAL --ignorefile /trivyignore.yaml --show-suppressed "$IMAGE:$GITHUB_SHA"

      - name: Synthèse Trivy dans le récapitulatif du run
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" -v "$RUNNER_TEMP:/out" "$TRIVY" \
            image --quiet --severity HIGH,CRITICAL --ignorefile /trivyignore.yaml \
            --format json -o /out/trivy.json "$IMAGE:$GITHUB_SHA"
          {
            echo "### Trivy : image ${{ matrix.service }} (HIGH et CRITICAL)"
            echo
            echo "| Composants | CRITICAL | HIGH |"
            echo "|---|---|---|"
            jq -r '[.Results[]? | .Class as $c | .Vulnerabilities[]? | {c: $c, s: .Severity}] as $v
              | [["os-pkgs", "Système (paquets Alpine)"], ["lang-pkgs", "Applicatifs (JAR, binaire Caddy)"]][]
              | . as [$k, $l]
              | "| \($l) | \([$v[] | select(.c == $k and .s == "CRITICAL")] | length) | \([$v[] | select(.c == $k and .s == "HIGH")] | length) |"' \
              "$RUNNER_TEMP/trivy.json"
            echo
            echo "Rapport seul, sans blocage ; détail dans l'étape « Rapport Trivy », exceptions dans \`.trivyignore.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publication sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io

  smoke-test:
    name: Test de fumée (images publiées)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      MICROCRM_TAG: ${{ github.sha }} # les images que ce run vient de publier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Démarrage avec les images publiées
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose pull
          docker compose up -d --no-build --wait
          docker logout ghcr.io

      - name: API et front répondent
        run: |
          curl -fsS -o /dev/null http://localhost:8080/persons
          docker compose cp front:/data/caddy/pki/authorities/local/root.crt caddy-root.crt
          curl -fsS -o /dev/null --cacert caddy-root.crt https://localhost/

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down -v

  promotion:
    name: Promotion latest (images validées)
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: latest pointe sur les images testées
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in back front; do
            image="ghcr.io/manooweb/microcrm-$service"
            # copie à l'identique dans le registre (même digest) : l'image n'est ni retéléchargée ni reconstruite
            docker buildx imagetools create --prefer-index=false -t "$image:latest" "$image:$GITHUB_SHA"
          done
          docker logout ghcr.io

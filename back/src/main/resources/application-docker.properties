# Profil activé dans l'image Docker (SPRING_PROFILES_ACTIVE=docker) : logs exploitables par ELK.
# Logs applicatifs en JSON, une ligne par événement
logging.config=classpath:logback-json.xml
# Journal des requêtes HTTP de l'API (statut, durée) en JSON sur la sortie standard
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern={"type":"access","client":"%a","method":"%m","uri":"%U","status":%s,"duree_ms":%{ms}T}
# Bannière de démarrage (texte sur plusieurs lignes) désactivée : elle n'est pas du JSON
spring.main.banner-mode=off
